name: Release

# 触发方式（三选一）：
#   1) 打 tag 推送：git tag v1.0.0-rc.2; git push origin v1.0.0-rc.2（总是构建全部目标）
#   2) Actions -> Release -> Run workflow（填写 tag，可选只构建 windows 或 android）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（如 v1.0.0-rc.2）"
        required: true
      prerelease:
        description: "标记为 pre-release"
        type: boolean
        default: true
      targets:
        description: "构建目标（只跑一侧时用于快速重试）"
        type: choice
        options:
          - all
          - windows
          - android
          - macos
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: windows (NSIS + exe)
    runs-on: windows-latest
    # tag 推送时 inputs.targets 为空 → 两侧都跑；手动触发时可只跑一侧。
    if: ${{ inputs.targets != 'android' && inputs.targets != 'macos' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: tauri build（含前端构建 + NSIS + 更新签名）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build
          } else {
            Write-Host "updater signing key not configured - building without updater artifacts"
            npx tauri build --config src-tauri/tauri.ci.conf.json
          }
      - name: 收集安装包、更新清单与校验值
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'src-tauri/target/release/bundle/nsis/*.exe' dist/
          Copy-Item 'src-tauri/target/release/chatters.exe' dist/
          # 自动更新产物（v3）：安装包的 .sig 签名与 latest.json 清单；未配置签名密钥时不存在。
          $bundle = 'src-tauri/target/release/bundle'
          Get-ChildItem $bundle -Recurse -File -Filter '*.sig' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ }
          if (Test-Path "$bundle/latest.json") { Copy-Item "$bundle/latest.json" dist/ }
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "{0}  {1}" -f $h, $_.Name
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: 生成 latest.json（Tauri v2 只产出 .sig，清单需自行生成）
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $setup = Get-ChildItem 'dist/*setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Host "no setup.exe - skip latest.json"; exit 0 }
          $sigFile = "$($setup.FullName).sig"
          if (-not (Test-Path $sigFile)) { Write-Host "no .sig (updater signing skipped) - skip latest.json"; exit 0 }
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($setup.Name)"
          $json = [ordered]@{
            version = $version
            notes = "Chatters $env:RELEASE_TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sigFile -Raw).Trim()
                url = $url
              }
            }
          }
          $json | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 dist/latest.json
          Get-Content dist/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  android:
    name: android (arm64 APK)
    runs-on: ubuntu-latest
    if: ${{ inputs.targets != 'windows' && inputs.targets != 'macos' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 SDK / NDK（使用 runner 预装 SDK，规避 setup-android 的 legacy tools 包问题）
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKM (SDK_ROOT=$SDK_ROOT)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - run: npm ci

      - name: 还原 release keystore（可选，未配置 Secrets 时自动跳过）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "release keystore not configured - falls back to the debug keystore"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "CHATTERS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "CHATTERS_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "CHATTERS_KEY_ALIAS=${ANDROID_KEY_ALIAS:-chatters}"
            echo "CHATTERS_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: tauri android build（arm64；由 CLI 生成 tauri.settings/tauri.properties 等胶水文件）
        run: npx tauri android build --apk --target aarch64 --config src-tauri/tauri.ci.conf.json

      - name: 收集并校验 APK（Gradle 已签名优先，否则回退 debug 签名）
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          SIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -path '*release/app-*release.apk' | head -1)
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "dist/Chatters-arm64-release.apk"
            APK="dist/Chatters-arm64-release.apk"
          else
            UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -path '*release/app-*release-unsigned.apk' | head -1)
            if [ -z "$UNSIGNED" ]; then
              echo "no APK produced"
              find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' || true
              exit 1
            fi
            "$BT/zipalign" -p -f 4 "$UNSIGNED" dist/Chatters-arm64-aligned.apk
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android \
              --key-pass pass:android --out dist/Chatters-arm64-debugsigned.apk \
              dist/Chatters-arm64-aligned.apk
            APK="dist/Chatters-arm64-debugsigned.apk"
          fi
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          (cd dist && sha256sum *.apk | tee -a SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/*

  macos:
    name: macos (universal dmg + app)
    runs-on: macos-latest
    # tag 推送时 inputs.targets 为空 → 与 windows/android 一起跑；手动触发可只跑 macos。
    if: ${{ inputs.targets != 'windows' && inputs.targets != 'android' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm

      # 同时安装 Apple Silicon 与 Intel 的 Rust std，产出 universal 包。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - run: npm ci

      # 未配置 APPLE_SIGNING_IDENTITY 时产出未签名包（Q13：阶段性允许未签名 dmg）。
      # 需要签名/公证时，在仓库 Secrets 配置 Apple 证书并在本 job 前导入 keychain；
      # Tauri 会自动读取 APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID。
      - name: 构建 universal .app + .dmg（hdiutil，无 Finder 依赖）
        run: bash tools/build-macos-dmg.sh --target universal-apple-darwin --out dist

      - name: 校验产物
        run: |
          set -euo pipefail
          ls -lh dist
          hdiutil verify dist/*.dmg
          unzip -l dist/*.app.zip | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*

  publish:
    name: publish release
    needs: [windows, android, macos]
    # 只跑一侧时其余 job 为 skipped：只要至少一侧成功就发布。
    if: ${{ always() && !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物（合并 SHA256SUMS，避免不同 job 的同名文件互相覆盖）
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.sig' -o -name 'latest.json' -o -name '*.dmg' -o -name '*.app.zip' \) -exec cp {} release/ \;
          find artifacts -name 'SHA256SUMS.txt' -exec cat {} + | sort -u > release/SHA256SUMS.txt
          ls -l release
          cat release/SHA256SUMS.txt
      - name: 修正 latest.json 下载地址（指向本次 Release 资产）
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ ! -f release/latest.json ]; then
            echo "no latest.json (updater signing key not configured) - skipping"
            exit 0
          fi
          SETUP=$(ls release/*setup.exe 2>/dev/null | head -1 || true)
          if [ -z "$SETUP" ]; then
            echo "no windows installer in this release - skipping latest.json URL rewrite"
            cat release/latest.json
            exit 0
          fi
          ASSET=$(basename "$SETUP")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          jq --arg url "$URL" '.platforms |= with_entries(.value.url = $url)' release/latest.json > latest.tmp
          mv latest.tmp release/latest.json
          cat release/latest.json
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Chatters ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: release/*
