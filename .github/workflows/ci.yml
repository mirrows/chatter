name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Android 构建较重（NDK + Gradle，约 10 分钟），只在手动触发时运行（见 android job）。
  workflow_dispatch:

# v2/M6：三平台矩阵，Windows 为必过，macOS/Linux 用于尽早暴露平台差异。
jobs:
  frontend:
    name: frontend (test + typecheck + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npx vue-tsc --noEmit
      - run: npx prettier --check "src/**/*.{ts,vue}" "tests/**/*.ts" "*.{json,ts}"

  rust:
    name: rust (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > clippy.out 2> clippy.err
          status=$?
          if [ "$status" -ne 0 ]; then
            # 默认 human 格式的诊断在 stderr（无缓冲，避免退出时丢行）；也兜底查 stdout。
            lines=$(grep -E "^(error|warning: )" clippy.err | head -20)
            if [ -z "$lines" ]; then
              lines=$(grep -E "^(error|warning: )" clippy.out | head -20)
            fi
            if [ -z "$lines" ]; then
              lines=$(tail -20 clippy.err)
            fi
            printf '%s\n' "$lines" | while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error::${line}"
              fi
            done
          fi
          exit "$status"

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: tauri build（不打包安装包，验证可编译）
        run: npx tauri build --no-bundle

  # Android arm64 构建（v3/§1.4）：手动触发，产出 debug 签名 APK 供真机验收。
  android:
    name: android (arm64 APK)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 SDK / NDK（使用 runner 预装 SDK，规避 setup-android 的 legacy tools 包问题）
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKM (SDK_ROOT=$SDK_ROOT)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - run: npm ci

      - name: 还原 release keystore（可选，未配置 Secrets 时自动跳过）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # GitHub Actions 不允许在 step 级 if 中使用 secrets 上下文，因此改用脚本判断。
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "release keystore not configured - Android build falls back to the debug keystore"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "CHATTERS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "CHATTERS_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "CHATTERS_KEY_ALIAS=${ANDROID_KEY_ALIAS:-chatters}"
            echo "CHATTERS_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: tauri android build（arm64；由 CLI 生成 tauri.settings/tauri.properties 等胶水文件）
        run: npx tauri android build --apk --target aarch64

      - name: 收集并校验 APK（Gradle 已签名优先，否则回退 debug 签名）
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT="src-tauri/target/android"
          mkdir -p "$OUT"
          SIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -path '*release/app-*release.apk' | head -1)
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUT/Chatters-arm64-release.apk"
            APK="$OUT/Chatters-arm64-release.apk"
          else
            UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -path '*release/app-*release-unsigned.apk' | head -1)
            if [ -z "$UNSIGNED" ]; then
              echo "no APK produced"
              find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' || true
              exit 1
            fi
            "$BT/zipalign" -p -f 4 "$UNSIGNED" "$OUT/Chatters-arm64-aligned.apk"
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android \
              --key-pass pass:android --out "$OUT/Chatters-arm64-debugsigned.apk" \
              "$OUT/Chatters-arm64-aligned.apk"
            APK="$OUT/Chatters-arm64-debugsigned.apk"
          fi
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: chatters-android-arm64
          path: src-tauri/target/android/*.apk
