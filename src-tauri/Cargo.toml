[package]
name = "chatters"
version = "1.0.0-rc.1"
description = "LAN P2P transfer tool for text, images and files"
edition = "2021"

[lib]
name = "chatters_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

# 桌面端专属依赖（v2/M9）：Android 不支持托盘、自启与单实例插件，
# 用 target 条件依赖隔离，避免移动端编译失败。
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# 集成测试放在 tests/<module>/<feature>.rs（rules.md R2.2）；
# Cargo 只自动发现 tests/ 根目录下的文件，因此子目录需显式登记。
[[test]]
name = "discovery_service"
path = "tests/discovery/discovery_service.rs"

[[test]]
name = "text_messaging"
path = "tests/session/text_messaging.rs"

[[test]]
name = "session_reconnect"
path = "tests/session/reconnect.rs"


[[test]]
name = "file_transfer"
path = "tests/transfer/file_transfer.rs"

[profile.release]
strip = true
lto = true
